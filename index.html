<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metróépítő játék</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--  MENÜ NÉZET  -->
    <section id="screen-menu">
        <h1>Metróépítő</h1>

        <div class="menu-box">
            <label for="player-name">Játékos neve:</label>
            <input type="text" id="player-name" placeholder="Add meg a neved...">

            <button id="start-game">Játék indítása</button>
            <button id="show-rules" class="secondary-btn">Szabályok</button>
        </div>
    </section>

    <!--  JÁTÉK NÉZET -->
    <section id="screen-game" style="display: none;">
        <!-- Felső státuszsor -->
        <header id="game-header">
            <div class="player-info">
                <span class="label">Játékos:</span>
                <span id="game-player-name"></span>
            </div>
            <div class="timer">
                <span class="label">Idő:</span>
                <span id="game-timer">0 s</span>
            </div>
            <div class="current-line">
                <span class="label">Épülő vonal:</span>
                <span id="current-line-name"></span>
            </div>
            <div class="line-order">
                <span class="label">Sorrend:</span>
                <span id="line-order-display"></span>
            </div>
        </header>
        <!-- Tábla + jobb oldali panel -->
        <main id="game-area">
            <!-- 10×10 tábla -->
            <div id="board-wrapper" style="position: relative;">
                <div id="board"></div>
                <svg id="board-lines" width="100%" height="100%"
                    style="position:absolute; top:0; left:0; pointer-events:none;"></svg>
            </div>
            <!-- Oldalsáv -->
            <aside id="controls">

                <div class="card-box">
                    <h3>Aktuális kártya</h3>
                    <div id="current-card" class="card-display">–</div>
                    <button id="draw-card">Kártya húzása</button>
                </div>

                <div id="score" class="score-box">
                </div>
            </aside>
        </main>
    </section>
    <script src="app.js"></script>

    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Játékszabályok</h2>
            <div id="rules-text"></div>
        </div>
    </div>
</body>

</html>
